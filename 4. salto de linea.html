<!DOCTYPE html>
<html lang="en">

<head>

    <!-- aqui es para que la pagina se vea bien en el celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- este es el titulo que esta arriba en la pestaña -->
    <title>Salto de linea en HTML</title>
</head>

<body>

    <!-- parrafo que explica los tipos de lenguajes -->
    <p>En la actualidad se utilizan diferentes
        lenguajes de programacion tanto para desarrollo

        Java<br>
        TypeScript<br>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- titulo de la pestaña del navegador -->
    <title>Enlaces en HTML</title>
</head>

<body>
    <h2>tipos de enlaces en HTML</h2>

    <p><strong>Enlaces/Hipervinculos a otra pagina del
         mismo sitio.
    </strong></p>

    <!-- enlace local, por defecto abre en la misma pestaña -->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>

    <!-- el target="_self" fuerza a que abra en la misma ventana -->
    <a href="2. Encabezados.html" target="_self">
        2. Encabezados</a><br>

    <!-- el target="_blank" abre el enlace en una pestaña nueva -->
    <a href="3. Parrafos.html" target="_blank">
        3. Parrafos</a><br>

    <!-- el target="_parent" abre la pagina en el marco -->
    <a href="4. Salto de linea.html" target="_parent">
        4. Salto de linea</a><br>

    <!-- el target="_top" rompe los marcos y abre la pagina en el cuerpo completo de la ventana -->
    <a href="5. Enfatizado.html" target="_top">
        5. Enfatizado</a><br>


    <p><strong>Enlaces/Hipervinculos a sitios externos
    </strong></p>

    <!-- enlace externo usando la direccion completa con https -->
    <a href="https://www.google.com/">Google</a><br>

    <!-- enlace externo que abre en la misma ventana -->
    <a href="https://www.youtube.com/" target="_self">
        YouTube</a><br>

    <!-- enlace externo que abre en una pestaña nueva -->
    <a href="https://www.facebook.com/" target="_blank">
        FaceBook</a><br>

    <!-- enlace externo con destino al marco padre -->
    <a href="https://www.wikipedia.com/" target="_parent">
        WikiPedia</a><br>

    <!-- enlace externo que cancela marcos y se abre en toda la ventana -->
    <a href="https://www.espanol.yahoo.com/" target="_top">
        Yahoo!</a><br>
</body>

</html>
